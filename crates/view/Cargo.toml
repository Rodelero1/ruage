[package]
name = "ruage-view"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only presentation layer: a snapshot of a match, a camera, and a software rasteriser"
# **`cargo run -p ruage-view` starts the window** (D164): the crate also ships a `frame` diagnostic binary, so without this every run
# needs `--bin window`, and the first person to type `cargo run` met "could not determine which binary to run" instead of the game.
default-run = "window"

[dependencies]
ruage-fixed = { path = "../fixed" }
ruage-data = { path = "../data" }
ruage-sim = { path = "../sim" }
# The window (D74: native, software presentation). `softbuffer` is the blit: the rasteriser already produces a pixel
# buffer, so the window's whole job is to put it on a surface and drive a fixed-step loop.
winit = "0.30"
softbuffer = "0.4"

[lints]
workspace = true
