[package]
name = "ruage-sim"
description = "Deterministic tick loop and state hash."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ruage-fixed = { path = "../fixed" }
ruage-data = { path = "../data" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bin]]
name = "ruage-headless"
path = "src/bin/headless.rs"
