# The acceptance match: a thirty-minute game played by the **base personality**, on the project pack.
#
# The behaviour is not written here. `ai = "base"` names `config/ai/base.toml`, which holds the opening as rules (D94) -
# train villagers, Loom at twelve, a house when the headroom is low, a mill and a camp, a barracks, Feudal, the Castle
# buildings, a siege workshop and a mangonel at the enemy town centre. This file says only what belongs to *this match*:
# how long it runs. Everything else about it is the personality's.
#
# The previous shape put the rules here, and before that it was 35 hand-measured `at_seconds` steps: every economy
# change moved the times and the file rotted. Rules whose guards are villager counts and stock amounts survive a rate
# correction, which is why the behaviour is separate from the match.
#
# The match is won by razing the town centre, which is what `ruage-batch` reports an outcome for.

schema = 2
# Thirty minutes, which is what the prose above has always said and what the canonical command plays: 1,800 s at
# 20 Hz is 36,000 ticks. The owner, 2026-11-06: "30 minutes is enough".
duration_seconds = 1800.0

# The behaviour is not here: it lives in `config/ai/base.toml` (D94). A scenario keeps what is scripted for this match.
ai = "base"
