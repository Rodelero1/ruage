# The acceptance match: a scripted fast castle that ends in a mangonel at a town centre (item 9).
#
# Every time is a *game* time in seconds, converted to ticks once by the runner (D16). The order is the researched
# one, adapted to what this map actually holds: the map's only natural food is six berry bushes (900 food in all), so
# the opening runs on berries and then **farms**, which are the food engine a 30-minute boom needs and which a script
# could not use at all until `node = "farm"` existed here.
#
# A step names *what*, never an id: `villager = 2` is this player's third villager by id order, and the ones trained
# afterwards follow it.
schema = 2
duration_seconds = 1800.0

[[step]]
at_seconds = 0
player = 1
kind = "gather"
villager = 0
resource = "food"

