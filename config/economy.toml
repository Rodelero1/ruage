# Economy. HAND-WRITTEN — safe to edit; never regenerated.
# Base rates and tech multipliers come from gamedata/ (unit work_rate, effect type 5 with
# c=13). Only what the dat does not settle lives here.

schema = 1

[farm]
# Which building is a farm, and what working it yields: both are content, because the engine has no
# idea what a farm is. A farm is the one building worth gathering from.
unit = "farm"
resource = "food"
# The dat's internal resource that farm upgrades add to. The dat has no resource names, so this id is
# the only handle: 36 is the farm food line — Horse Collar +75, Heavy Plow +125, Crop Rotation +175.
# Leave it out and no tech changes farm food.
food_resource = 36

rate = 0.4
# PROVENANCE: dat — FARM.task_info.work_rate (unit id 50). Fixed by decision D5.
# Mechanism unresolved: the farmer villager (id 259) carries 0.530, the farm building 0.400.
# Construction-speed reading was tested and falsified (HOUS has work_rate 0.0 and builds in 25 s).
# Settle with two saves 60 s apart: food delta / (farmers * 60).
# Range if wrong: 0.319 published, 0.530 raw villager.

use_villager_rate = false
# While true, the farmer variant's own work_rate is ignored in favour of `rate` above.
# Flip to true to test the 0.530 reading without editing any code.

[farm.depletion]
food_per_farm = 250
# PROVENANCE: published. Not a dat field found so far.

[gather]
# How fast a villager takes hit points off a **standing tree**, per second. Trees must be felled before they yield (the
# owner's rule, 2026-10-30); the dat gives a forest tree 20 hit points (25, 30 for variants), a bush or a mine none.
#
# PROVENANCE: dat - villager VMBAS (83) `combat_info.attacks` is [3, 3, 6, 0] and `combat_info.reload_time` is 2.0, so a
# chop is **3 hit points every 2 seconds** = 1.5/s, and a 20 hp tree falls in 13.3 seconds (seven chops). The owner's
# recollection of "3 hp a chop, upgradeable" matches the data; whether a tech raises it is a tech-tree question, and the
# number here is the dark-age base.
fell_hp_per_second = 1.5
rate_from = "dat"
# Per-task-variant work_rate: VMLUM 0.390, VMGLD 0.380, VMMIN 0.360, VMSHE 0.330,
# VMFOR 0.310, VMHUN 0.410 (carry 35), VMFIS 0.430. Validated against published values
# in docs/mechanics/economy.md.

carry_from = "dat"
drop_sites_from = "dat_variant"

[gather.resource_task]
# Which gather task a node of each map kind presents. Our map (D15) has berry bushes as its food,
# so food is foraged; hunting and fishing exist as variants but nothing on this map triggers them.
# Every value must be a key in [gather.variant] below - the loader refuses a dangling name.
wood = "wood"
food = "forage"
gold = "gold"
stone = "stone"
# Lookup must use the TASK VARIANT, not the base villager: the lumberjack lists the lumber
# camp (562), the miner the mining camp (584). Base VMBAS lists only TC + mill.

[gather.variant]
# Which villager VARIANT a task switches to (D11). The dat cannot supply this mapping at
# VER 5.7.2 — GenieDatParser raises VersionError on the per-task list — so it is stated here,
# because D6 forbids stating it in code. Rates, carry and drop sites are NOT repeated below:
# they come from gamedata/units.toml for the variant id named here.
#
#   task    id    unit    rate   drop sites
wood     = 123   # VMLUM 0.390  SMIL 562
gold     = 579   # VMGLD 0.380  MINE 584
stone    = 124   # VMMIN 0.360  MINE 584
forage   = 120   # VMFOR 0.310  MILL 68
hunt     = 122   # VMHUN 0.410  MILL 68 (carry 35)
fish     = 56    # VMFIS 0.430  MILL 68
herd     = 592   # VMSHE 0.330  MILL 68
farm     = 259   # VMFAR 0.530  capped at 0.400 by the farm building (D5)
build    = 118   # VMBLD 1.000  the build task: a rate of 1.0 that is NOT a gather rate
repair   = 156   # VMREP 12.5   the repair task, likewise not a gather rate
#
# The base villager (VMBAS 83) is deliberately absent: its work_rate is 1.0, the build task's,
# and using it as a gather rate would make every villager gather 2.5x too fast.

[build]
# Which roles block movement once built. A wall is a building whose tile nobody can walk through;
# nothing else this pack builds does, which is why the rule is content's list and not a class id.
# PROVENANCE: dat ids (the pack's four wall types are 72/117/119/155).
blocking_roles = ["wall"]


# No build speed here on purpose. A building's HP/second is derived from the unit table:
# hp / create_time (a house is 550 hp over 25 s). There is no knob, because a knob would be a
# number we invented - and U15 taught that the number was in the dat all along, under a name
# that did not look like "build time".
repair_hp_per_second = -1.0
# PROVENANCE: unknown, with a dat CANDIDATE: the repair variant VMREP (id 156) carries
# work_rate = 12.5. If that is HP/second it is the answer; the semantics are unverified, so the
# sentinel stays and the engine still refuses. Testing it is one scenario: damage a building,
# repair it for 60 s, divide HP restored by villager-seconds.

[build.requires]
# The game's building prerequisites (D63): role -> the role that must have been built **once**, not
# "still standing", because destroying the blacksmith does not take the siege workshop away. AoE2's
# Siege Workshop needs a Blacksmith; the Archery Range the owner remembered is the *first* game's rule
# (Barracks + Archery Range there). From the official learn-to-play page: farms and a market need a mill,
# an archery range or a stable needs a barracks.
siege_workshop = "blacksmith"
# market = "mill", farm = "mill", archery_range/stable = "barracks" are the game's too, and are added
# when the pack's own tests can carry them: a prerequisite this wide changes every opening. What is in
# the file is what the engine enforces, and only the siege workshop's is enforced today.

[decay]
enabled = true
rate_from = "dat"
# unit.resource_decay_rate exists per unit; semantics unverified.

[start]
# What a match begins with, named by role. The ids live in [role] below, so nothing outside the
# content pack has to know that a town centre is 109 (D17).
town_centre = "town_centre"
villager = "villager"
villagers_per_player = 3
# What the match opens with. Every tech in the table lists the Dark Age tech as a prerequisite, so a
# match that did not start with it could research nothing at all.
techs = ["dark_age"]
# Which civilisations the match is played as: entry n is player n+1, and the last entry covers any
# further player. The civ table (civs.toml) carries the ids and the effects that list what each civ
# cannot research, so content names civs and never an effect id.
civs = ["British", "Huns"]
# The standard opening. Every name here must be a column in resources.toml: a starting stockpile of a
# resource the pack does not have is refused when the match is seeded, not silently dropped.
stock = { food = 200, wood = 200, gold = 100, stone = 200 }
# PROVENANCE: dat (ids, hp, speed) + the standard 3-villager start. The count is a match
# rule, not a dat field, which is exactly why it belongs in config.

# How many units one building may hold at once: the one being made plus those queued behind it. Five is
# the game's number. A queued order is paid when it is placed, which is what makes a queue a commitment.
[train]
queue_length = 5

[[train.entry]]
building = "town_centre"
units = ["villager"]
# PROVENANCE: authored, not a dat field we read. The dat says what a unit costs and how long it
# takes, and the tech tree disables units per civ, but nothing we parse says "this building
# makes that unit". So the mapping is content - and it names roles, like everything else that has
# to talk about a unit (D17): a town centre makes villagers, a barracks makes spearmen.

# A barracks trains the spear line, and it trains it exactly as far as the player has unlocked it: the
# spearman is availability (kind 2), the pikeman and halberdier are upgrades (kind 3), so the engine
# refuses the latter two until their techs land.
[[train.entry]]
building = "barracks"
units = ["militia", "spearman"]

[[train.entry]]
building = "castle"
units = ["trebuchet"]

[[train.entry]]
building = "siege_workshop"
units = ["mangonel"]
# PROVENANCE: authored edge, dat numbers. The workshop (49 SIWS) and the mangonel (280 MANGO) are the dat's;
# which building may make what is content, like every other train edge (D17). The mangonel is class 13
# (siege), 50 hp, range 7 / minimum 3, 160 wood + 135 gold, 6 s reload, 35 attack against buildings.
# A barracks makes spearmen (40 hp, 0.9 tiles/s, 60 food + 20 gold, 21 s).

[role]
# A role is the engine's word for a unit: everything that must not quote the dat's numbering uses
# one - the start above, the scenario format, and the engine's own seeding. Add a role here and a
# scenario can name it; the ids are the reference pack's and change with the dat (D17).
town_centre = 109   # RTWC, the building a villager drops wood at
villager = 83       # VMBAS, 25 hp, 0.8 tiles/s
house = 70          # HOUS, 25 wood, 25 s
barracks = 12       # BRKS
# 74 is the MILITIA, not a spearman: the dat's name field says SPRMN, but its stats are the militia's
# (40 hp, 60 food/20 gold, 21 s) and every infantry upgrade - Man-at-Arms, Long Swordsman, Two-Handed
# Swordsman, Champion - upgrades *from* 74. The spear line is 93 -> 358 -> 359.
militia = 74        # 40 hp, 60 food + 20 gold, 21 s: the Dark Age infantry unit
spearman = 93
# The building a villager works for food. The engine treats it like any other building except for
# this one thing: `[farm]` says its work yields the `food` column.
farm = 50       # 45 hp, 35 food + 25 wood, 22 s: available once the Feudal Age lands (tech 87)
wall = 72       # WALL (palisade), 250 hp, 2 wood: the segment in [build] blocking_roles
pikeman = 358       # 55 hp: an upgrade, researched (tech 197, Castle Age)
halberdier = 359    # 60 hp: an upgrade, researched (tech 429, Imperial)
castle = 82         # CSTL, 4800 hp - available from the Castle Age (tech 137 makes it)
trebuchet = 331     # PTREB - available from the Imperial Age (tech 256 makes it)
siege_workshop = 49 # SIWS, class 3, 1800 hp, 200 wood: the building that makes the siege line
blacksmith = 103    # BLAC, class 3, 1800 hp, 150 wood: the Feudal Age prerequisite of the siege workshop
mill = 68           # MILL, class 3, 600 hp, 100 wood: a Dark Age building (and the farm prerequisite)
mining_camp = 584   # MINE, class 3, 600 hp, 100 wood: a Dark Age building
market = 84         # MRKT, class 3, 1800 hp, 175 wood: a Feudal Age building
stable = 101        # STBL, class 3, 1500 hp, 175 wood: a Feudal Age building
archery_range = 87  # ARRG, class 3, 1500 hp, 175 wood: a Feudal Age building
lumber_camp = 562   # SMIL (the dat's "saw mill"), class 3, 600 hp, 100 wood: a Dark Age building
sheep = 594         # SHEEPG, class 58: 7 hp, 100 food, leaves body 595 (D69)
boar = 48           # BOARX, class 10 (Gaia only): 75 hp, 340 food, leaves body 356
deer = 65           # DEERX, class 9 (Gaia only): 140 food, leaves body 43
sheep_carcass = 595 # SHEEP_D, class 11: the body a slaughtered sheep becomes
boar_carcass = 356  # BOARX_D, class 11
deer_carcass = 43   # DEERX_D, class 11
mangonel = 280      # MANGO, class 13: 50 hp, 7 range / 3 minimum, 160 wood + 135 gold, 6 s reload,
                    # 35 vs buildings and 40 vs units - the first thing in the pack that breaks a base

[tech_role]
# A tech has no name in the dat (names are string-ids into the language files), so content that has
# to name one - the scenario format, a UI - uses these. Same rule as [role]: the ids are the
# reference pack's, the words are ours (D17).
dark_age = 104      # free, instant, no home building: the prerequisite every other tech lists
man_at_arms = 222   # 100 food + 40 gold, 40 s: spearmen (74) become swordsmen (75)
loom = 22           # 50 gold, 25 s, at the town centre: villagers 25 -> 40 health
feudal_age = 101    # the prerequisite Man-at-Arms lists; its effect is a tech-tree gate, unimplemented
castle_age = 102    # 800 food + 200 gold, 160 s, at the town centre (location 109). Verified by price and
                    # time, not by number - and it is what opens the siege workshop's unit.
imperial_age = 103  # 1000 food + 800 gold, at the town centre: named for completeness, nothing gates on it yet

[age]
# Advancing an age needs buildings of the *current* one (D65). The official learn-to-play page and
# Liquipedia agree, and the game's own summary is the rule in one sentence: "advancement requires you to
# construct at least two buildings from the current Age". Houses, farms, walls and outposts never count.
# The Castle Age is the exception: two Castle Age buildings *or* a single Castle reach the Imperial Age.
#
# `of` lists the roles that count; `single` lists roles that satisfy the requirement on their own.
[age.requires]
feudal_age = { count = 2, of = ["mill", "mining_camp", "barracks"] }
castle_age = { count = 2, of = ["blacksmith", "market", "stable", "archery_range"] }
imperial_age = { count = 2, of = ["castle", "siege_workshop"], single = ["castle"] }

[population]
cap_default = 200
house_population = 5
# A town centre supports five units, like a house; a castle twenty (not modelled yet). Published:
# the game manual and the AoE2 DB both say five, and the Chinese +5 is a civ bonus, not a rule here.
town_centre_population = 5
# PROVENANCE: published. Per-building values are in the dat only indirectly (civ resources
# array, U8) so they are stated here instead.

[hunt]
# Herding (owner's rule, D70): an animal being gathered walks toward the nearest drop site of the
# villager's player, and the villager follows it. Which animals herd is content's answer - the engine
# knows nothing about sheep (D17).
herdable_roles = ["sheep"]
# Which animals carry meat at all - both kinds, herdable (58) and huntable (9, 10), because a boar or a deer
# is as edible as a sheep. Herding and meat are two questions, so they are two lists.
animal_roles = ["sheep", "boar", "deer"]
# What an animal yields while it is alive and what its body holds after (D69, D70).
resource = "food"
# The bodies: what a slaughtered animal becomes in place, and what may therefore be gathered from a thing
# with no health. A carcass is a different unit id, not an inference (D70).
carcass_roles = ["sheep_carcass", "boar_carcass", "deer_carcass"]
# The leash (D71): a struck animal chases, loses interest, and walks back to where it was first struck.
# Every new blow renews the interest, which is what a hunter's second arrow is *for*.
#
# PROVENANCE: authored, both numbers. The dat has no leash field - `BOARX` carries `los = 4.0`,
# `speed = 0.8` and nothing that means "gives up" - so these are judgement calls, not game numbers, and
# they are the knobs a balance run turns. A lure that has to reach a town centre from a boar camp is
# typically 10-20 tiles, and `leash_tiles` must be larger than the distance a lure has to cover.
leash_seconds = 10
leash_tiles = 12
# Whose blow leaves meat in the body (D70, the owner's rule: *"Villager has to be the one delivering last blow"*).
# Soldiers may soften the animal and arrows may stick in it; only this role's *last* blow leaves the carcass worth
# eating. Roles, not ids: the engine never learns that a villager is 83 (D17). An empty list means every kill
# leaves its meat, which is what a pack that says nothing gets.
butcher_roles = ["villager"]

[conquest]
# What keeps a side in the match (D59). The original game's rule, from the manual, twice:
#
#   "To defeat a player, you must destroy all units and buildings but the following: towers, walls, gates,
#    relics, Fishing Ships, Fish Traps, Transport Ships, Trade Cogs, Trade Carts, Farms, and sheep."
#
# So defeat is a negative condition - nothing *qualifying* left - and the town centre is not special:
# losing it is a setback, not the end, because a villager can rebuild it.
#
# Which *classes* of building keep a player in the match (D59b). The manual's exclusion list turns out to
# be a list of classes, not of buildings - the Genie Editor's table calls class 3 "Building: all buildings
# except towers, walls, gates and Monument", and the dat agrees:
#
#   3  - 129 units: HOUS, BRKS, ARRG, BLAC, MRKT, RTWC/RTWC2/RTWC3, CSTL ...   counts
#   27 - walls (WALL, TWAL, CWAL, SWAL, Aqueduct)                              excluded by the manual
#   39 - gates (GTAA*, GTAB* ...)                                             excluded by the manual
#   49 - farms and fish traps (FARM, FTRAP, RFARM)                            excluded by the manual
#   52 - towers (WCTW, HTAT, HTOF ...)                                        excluded by the manual
#   1  - artifacts and relics (ARTCT, KOH-FLAG)                               excluded by the manual
#
# So the rule needs no role list and cannot be forgotten building by building: class 3 counts, everything
# else does not. The numbers are the dat's (D17): content may quote them, the engine may not - the engine
# only asks "is this class in the list". A house is class 3, the same class as a barracks, which is why the
# original counts a house and why this does too.
surviving_classes = [3]

[metrics]
# What a balance run counts as a **military** unit (D17: the engine never learns that a militia is 74). A role that
# the pack cannot name is skipped rather than refused - a metric is a measurement, not a rule of the game.
military_roles = ["militia", "spearman", "pikeman", "halberdier", "mangonel", "trebuchet"]

# Villager shares, in the shape the game's own AI uses (`docs/ai-of-the-game.md`): a percentage per resource, per
# villager count, which the engine applies to idle villagers. The numbers below are read from HD's
# `Economy/Low-pop Villager Distribution.per`, whose 19 rules cover 1 to 26+ villagers and every row sums to 100;
# the row with the highest `at_villagers` the player has reached is the one that applies. A resource a row does not
# name is 0%. Empty (or absent) means "no policy": the engine then never moves a villager on its own.
[policy]

[[policy.share]]
at_villagers = 0
food = 100

