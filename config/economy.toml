# Economy. HAND-WRITTEN — safe to edit; never regenerated.
# Base rates and tech multipliers come from gamedata/ (unit work_rate, effect type 5 with
# c=13). Only what the dat does not settle lives here.

schema = 1

[farm]
rate = 0.4
# PROVENANCE: dat — FARM.task_info.work_rate (unit id 50). Fixed by decision D5.
# Mechanism unresolved: the farmer villager (id 259) carries 0.530, the farm building 0.400.
# Construction-speed reading was tested and falsified (HOUS has work_rate 0.0 and builds in 25 s).
# Settle with two saves 60 s apart: food delta / (farmers * 60).
# Range if wrong: 0.319 published, 0.530 raw villager.

use_villager_rate = false
# While true, the farmer variant's own work_rate is ignored in favour of `rate` above.
# Flip to true to test the 0.530 reading without editing any code.

[farm.depletion]
food_per_farm = 250
# PROVENANCE: published. Not a dat field found so far.

[gather]
rate_from = "dat"
# Per-task-variant work_rate: VMLUM 0.390, VMGLD 0.380, VMMIN 0.360, VMSHE 0.330,
# VMFOR 0.310, VMHUN 0.410 (carry 35), VMFIS 0.430. Validated against published values
# in docs/mechanics/economy.md.

carry_from = "dat"
drop_sites_from = "dat_variant"

[gather.resource_task]
# Which gather task a node of each map kind presents. Our map (D15) has berry bushes as its food,
# so food is foraged; hunting and fishing exist as variants but nothing on this map triggers them.
# Every value must be a key in [gather.variant] below - the loader refuses a dangling name.
wood = "wood"
food = "forage"
gold = "gold"
stone = "stone"
# Lookup must use the TASK VARIANT, not the base villager: the lumberjack lists the lumber
# camp (562), the miner the mining camp (584). Base VMBAS lists only TC + mill.

[gather.variant]
# Which villager VARIANT a task switches to (D11). The dat cannot supply this mapping at
# VER 5.7.2 — GenieDatParser raises VersionError on the per-task list — so it is stated here,
# because D6 forbids stating it in code. Rates, carry and drop sites are NOT repeated below:
# they come from gamedata/units.toml for the variant id named here.
#
#   task    id    unit    rate   drop sites
wood     = 123   # VMLUM 0.390  SMIL 562
gold     = 579   # VMGLD 0.380  MINE 584
stone    = 124   # VMMIN 0.360  MINE 584
forage   = 120   # VMFOR 0.310  MILL 68
hunt     = 122   # VMHUN 0.410  MILL 68 (carry 35)
fish     = 56    # VMFIS 0.430  MILL 68
herd     = 592   # VMSHE 0.330  MILL 68
farm     = 259   # VMFAR 0.530  capped at 0.400 by the farm building (D5)
build    = 118   # VMBLD 1.000  the build task: a rate of 1.0 that is NOT a gather rate
repair   = 156   # VMREP 12.5   the repair task, likewise not a gather rate
#
# The base villager (VMBAS 83) is deliberately absent: its work_rate is 1.0, the build task's,
# and using it as a gather rate would make every villager gather 2.5x too fast.

[build]
# No build speed here on purpose. A building's HP/second is derived from the unit table:
# hp / create_time (a house is 550 hp over 25 s). There is no knob, because a knob would be a
# number we invented - and U15 taught that the number was in the dat all along, under a name
# that did not look like "build time".
repair_hp_per_second = -1.0
# PROVENANCE: unknown, with a dat CANDIDATE: the repair variant VMREP (id 156) carries
# work_rate = 12.5. If that is HP/second it is the answer; the semantics are unverified, so the
# sentinel stays and the engine still refuses. Testing it is one scenario: damage a building,
# repair it for 60 s, divide HP restored by villager-seconds.

[decay]
enabled = true
rate_from = "dat"
# unit.resource_decay_rate exists per unit; semantics unverified.

[start]
# What a match begins with, named by role. The ids live in [role] below, so nothing outside the
# content pack has to know that a town centre is 109 (D17).
town_centre = "town_centre"
villager = "villager"
villagers_per_player = 3
# PROVENANCE: dat (ids, hp, speed) + the standard 3-villager start. The count is a match
# rule, not a dat field, which is exactly why it belongs in config.

[[train.entry]]
building = "town_centre"
units = ["villager"]
# PROVENANCE: authored, not a dat field we read. The dat says what a unit costs and how long it
# takes, and the tech tree disables units per civ, but nothing we parse says "this building
# makes that unit". So the mapping is content - and it names roles, like everything else that has
# to talk about a unit (D17): a town centre makes villagers, a barracks makes spearmen.

[[train.entry]]
building = "barracks"
units = ["spearman"]
# A barracks makes spearmen (40 hp, 0.9 tiles/s, 60 food + 20 gold, 21 s).

[role]
# A role is the engine's word for a unit: everything that must not quote the dat's numbering uses
# one - the start above, the scenario format, and the engine's own seeding. Add a role here and a
# scenario can name it; the ids are the reference pack's and change with the dat (D17).
town_centre = 109   # RTWC, the building a villager drops wood at
villager = 83       # VMBAS, 25 hp, 0.8 tiles/s
house = 70          # HOUS, 25 wood, 25 s
barracks = 12       # BRKS
spearman = 74       # SPRM, 40 hp, 0.9 tiles/s

[tech_role]
# A tech has no name in the dat (names are string-ids into the language files), so content that has
# to name one - the scenario format, a UI - uses these. Same rule as [role]: the ids are the
# reference pack's, the words are ours (D17).
man_at_arms = 222   # 100 food + 40 gold, 40 s: spearmen (74) become swordsmen (75)
loom = 22           # 50 gold, 25 s, at the town centre: villagers 25 -> 40 health
feudal_age = 101    # the prerequisite Man-at-Arms lists; its effect is a tech-tree gate, unimplemented

[population]
cap_default = 200
house_population = 5
# PROVENANCE: published. Per-building values are in the dat only indirectly (civ resources
# array, U8) so they are stated here instead.
