# Engine knobs. HAND-WRITTEN — safe to edit; never regenerated.
# Provenance tags: measured | published | dat | unknown | placeholder
# A value of -1.0 (or "unresolved") means NOT YET DETERMINED. Strict loading means the
# engine must refuse to start a scenario that needs an unresolved value.

schema = 1

[sim]
tick_rate_hz = 20
# PROVENANCE: unknown (U12). AoK-era programmers describe a fixed "game turn"; 20 Hz is the
# commonly cited value, 60 Hz was measured for combat timing in DE. Every duration derives
# from this — change it and re-baseline all tests.

fixed_point_scale = 20000
# 1/20000 of a tile — derived, not chosen. The loader enforces two rules:
#   scale % 10^dat_value_decimals == 0                     (no value is ever rounded)
#   scale % (tick_rate_hz x 10^per_tick_decimals) == 0     (no motion ever drifts)
# At 20 Hz and thousandths the second rule gives exactly 20000, and it is the SMALLEST such
# scale: 0.8 -> 800 per tick, 0.96 -> 960, 1.35 -> 1350, 1.54 -> 1540, 8.8 -> 8800,
# 0.737 -> 737. Recomputed independently over all 56 nonzero dat speeds.
# Change tick_rate_hz and this must change with it (60 Hz needs 60000); the loader refuses the
# stale pairing rather than run with per-tick drift.
# Position headroom is not a constraint: positions are i64, so 480 tiles is 9.6e6 of 9.2e18.

dat_value_decimals = 4
# PROVENANCE: measured. The finest grain anywhere in the dat is `work_rate = 0.0111` on units
# 110 (TDWS) and 1021 (FEITO) — 4 places, so 10^4 must divide the scale. Everything else is
# 2 dp or coarser, and speeds are at most 3 dp (0.737).

per_tick_decimals = 3
# PROVENANCE: measured. The finest grain among quantities integrated every tick is the speed
# 0.737 (unit 1136, 3 dp), so tick_rate x 10^3 = 20000 must divide the scale. This is the
# value that makes 10000 insufficient. Both grains are checked against the whole generated
# corpus by crates/data/tests/corpus.rs, which fails if a dat value ever needs more places.

max_entities = 4096
state_hash_interval_ticks = 20
command_apply = "next_tick"      # next_tick | immediate

[determinism]
# Rules from docs/mechanics/determinism.md. Changing these breaks replay compatibility.
floats_in_sim_state = false      # the sim uses fixed-point only; floats exist at load only
iteration_order = "entity_id"    # never hash order
rng_streams = ["sim", "map"]     # separate streams so map gen cannot perturb combat RNG

[rng]
algorithm = "pcg32"
# PROVENANCE: unknown — the original engine's RNG is not published. Any choice here changes
# every random outcome (accuracy rolls, dispersion, conversion), so it is a G1 tolerance
# decision, not a fidelity claim.
seed_source = "explicit"

[paths]
gamedata = "gamedata"
overrides = "overrides.toml"
