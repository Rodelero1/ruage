# Combat model. HAND-WRITTEN — safe to edit; never regenerated.
# Implemented formula (docs/mechanics/combat.md):
#   damage = max(1, k_elev * sum_i[ max(0, atk_i - arm_i) ] )
# Unit attack/armour arrays come from gamedata/units.toml; only the constants live here.

schema = 1

garrison_eject_fraction = 0.2
# PROVENANCE: published (Fandom "Garrison", Aoe2Sheet): a building ejects its garrison once it is at 20%
# of its hit points or below, and takes nobody in until repaired above it. Units inside a ram or siege
# tower are the exception - only destruction ejects them - and this engine has no garrisonable ram yet.

projectile_speed = 10.0
# PROVENANCE: authored. A shot is an entity that flies at this many tiles per second, and ten is a
# stand-in for the dat's per-unit missile speed, which this importer does not read yet. Zero would make
# every shot land instantly, which is the behaviour before projectiles existed.

aggro_radius = 6.0
# PROVENANCE: authored. How far an attack-moving or patrolling unit looks for an enemy, in tiles. AoE2's
# aggressive stance chases a sight beyond its own weapon reach, and six tiles is a stand-in for a number
# the data does not state. Zero would make attack-move a move with extra steps.

aggro_scan_ticks = 5
# PROVENANCE: authored. How often a hunting unit looks around. A scan is the only order-path cost that
# grows with the size of the world (it is a pass over every entity), so it is decimated: at 20 Hz a unit
# reconsiders its neighbourhood four times a second, which a player cannot see. Zero means every tick.

accuracy_scatter = 2.0
# PROVENANCE: authored. How far off the mark, in tiles, a shot lands when the shooter's accuracy roll
# fails. Accuracy itself is per unit and comes from the dat (an archer 80, a hand cannoneer 65, every
# building that shoots 100); what the data does not say is how *far* a missed shot goes, because the game
# animates the miss rather than stating a distance. Two tiles is roughly a unit's own footprint plus the
# width of the group it was standing in. Zero would make every shot aimed true, which is how a pack
# written before accuracy existed behaves.

[damage]
minimum = 1
# PROVENANCE: published (Fandom "Armor class (AoE II)", "Pierce armor", aoe2database).
# Applied AFTER multipliers, so a 1.25x elevation hit never floors below 1.

armour_missing_sentinel = 10000.0
# Armour value assumed for a class the target does not list. Large enough that
# max(0, atk - 10000) = 0, i.e. no damage from that class. Published values: 1000 or 10000.

bonus_resist_default = 0.0
# k_res. AoC/HD have no bonus-resist units (Sicilians/Bengalis are DE). If 5.7 has any,
# this becomes per-unit data instead.

[elevation]
attacker_above = 1.25
attacker_below = 0.75
# PROVENANCE: published. 5.7-specific values unverified — the residual of U4.

[attack_timing]
damage_at_animation_fraction = 0.5
# PROVENANCE: unknown. Published analysis says melee damage lands at 0% or 50% of the attack
# animation; ranged releases a projectile. Affects effective DPS slightly, not per-hit damage.

use_reload_from_dat = true
# interval = unit.reload (seconds). Techs scale the INTERVAL, not the rate: Celts x0.8,
# Japanese x0.75 (i.e. +25% and +33% rate).

[buildings]
can_attack = true
# Towers/TCs carry attack arrays in the dat; nothing special needed beyond normal combat.
