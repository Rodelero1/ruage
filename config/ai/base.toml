# The base AI personality: what the player's economy and army *do*, written as rules (D94).
#
# This file is behaviour, not configuration. `config/` says what the world is - a house is 25 wood, the spear line
# counters cavalry, a villager carries ten - and this says what to do with it: which units to train, what to build and
# when, and where the villagers go. A scenario names a personality (`ai = "base"`) and supplies only what is scripted
# for that match; the opening below is shared by every match that does not write its own.
#
# What it says, in the game's own numbers:
#   * train villagers below the AI's Dark Age target (28 before Feudal - `Economy/Dark Age.per`);
#   * Loom at 12 villagers, once;
#   * a house whenever the headroom falls under three;
#   * a mill by the berries at 9, a lumber camp by the wood at 10;
#   * a barracks (the second Dark Age building the Feudal Age wants - D65);
#   * Feudal at 22 villagers with mill and barracks up (the AI says 28; 22 is our own earlier number, and it is the one
#     threshold here that is a choice rather than a reading);
#   * a feudal barracks trains the militia line to **twelve soldiers** (`army_at_most`), because one soldier is not an
#     army and a barracks alone does not win a match;
#   * at **eight** soldiers the army attacks the enemy town centre as a body (`army_at_least`) - the owner's item 8,
#     "gather an army first, then attack";
#   * market + blacksmith in Feudal, Castle once both stand;
#   * a siege workshop, a mangonel, and the mangonel at the enemy town centre.

schema = 1

[[rule]]
player = 1
cooldown_seconds = 2.0
when = { villagers_at_most = 27 }
do = "train"
building = "town_center"
role = "villager"

# Loom once, at 12 villagers and not before 2:00: the AI's own guard (`Economy/Dark Age.per`) is the villager count;
# the time gate is ours, and it exists because Loom's 50 food competes with villager production at twelve. Whether it
# earns its place is a measurement (run the acceptance match with and without) rather than a reading - it is the one
# threshold in this file that is neither the game's nor a rate that survives a correction.
[[rule]]
player = 1
cooldown_seconds = 5.0
at_seconds = 120.0
when = { villagers_at_least = 12, no_tech = "loom" }
do = "research"
building = "town_center"
tech = "loom"

# --- housing -----------------------------------------------------------------------------------------------------

[[rule]]
player = 1
cooldown_seconds = 4.0
when = { housing_at_most = 3 }
do = "build"
role = "house"

# --- the Dark Age economy ----------------------------------------------------------------------------------------

[[rule]]
player = 1
cooldown_seconds = 5.0
when = { villagers_at_least = 9, no_building = "mill" }
do = "build"
role = "mill"
where = "food"

# The lumber camp comes **before** the farms, at ten villagers: it is what makes wood income possible, and a farm costs
# 25 wood. The first version asked for the camp at fourteen and for farms from the mill onwards, so the farms spent the
# wood the camp needed and the run never had a camp, never mind a barracks - 1,400 seconds of a 200-wood opening.
[[rule]]
player = 1
cooldown_seconds = 5.0
when = { villagers_at_least = 10, no_building = "lumber_camp" }
do = "build"
role = "lumber_camp"
where = "wood"

# Two buildings of the current age open the Feudal Age (D65): a mill and a barracks.
[[rule]]
player = 1
cooldown_seconds = 6.0
when = { villagers_at_least = 18, no_building = "barracks" }
do = "build"
role = "barracks"

[[rule]]
player = 1
cooldown_seconds = 8.0
# `no_tech`: without it the rule asked 132 more times after the research landed ("tech 101 has already been researched").
when = { villagers_at_least = 22, has_building = ["mill", "barracks"], no_tech = "feudal_age" }
do = "research"
building = "town_center"
tech = "feudal_age"

# --- the army: gather it first, then send it ---------------------------------------------------------------
#
# The owner's item 8, in two rules. **One soldier is not an army**: the old shape waited on `has_unit` (a single
# mangonel) and re-issued the same order every twelve seconds, so eleven soldiers could stand at the barracks while one
# unit fought. `army_at_most` caps the line so it stops at a size instead of spending the larder, and `army_at_least`
# waits until the body exists before it is sent.
#
# Militia at Feudal, not in the Dark Age: the 60 food a soldier costs is the food the 500-food age-up needs, and a
# Dark Age army arrives before there is anything to defend. The upgrade line is the same family, so a man-at-arms
# counts toward the twelve and answers to the same order.
[[rule]]
player = 1
cooldown_seconds = 6.0
when = { age = "feudal_age", has_building = ["barracks"], army_at_most = 11 }
do = "train"
building = "barracks"
role = "militia"

[[rule]]
player = 1
cooldown_seconds = 12.0
when = { army_at_least = 3 }
do = "attack"
attacker = "militia"
target = "enemy_town_center"

# --- Feudal: the buildings the Castle Age needs ------------------------------------------------------------------

[[rule]]
player = 1
cooldown_seconds = 6.0
when = { age = "feudal_age", no_building = "market" }
do = "build"
role = "market"

[[rule]]
player = 1
cooldown_seconds = 6.0
when = { age = "feudal_age", no_building = "blacksmith" }
do = "build"
role = "blacksmith"

# Farms as soon as the mill stands and the larder is thin - **not** at Feudal. A farm is a Dark Age building gated by the
# mill, which is why the game's own AI farms through the Dark Age; gating this on `age = "feudal_age"` starved the run at
# 18 villagers with 46 food, which is exactly the wall the first version hit.
[[rule]]
player = 1
cooldown_seconds = 6.0
# A farm only when there is wood **to spare**: 25 wood a farm, and the lumber camp and barracks come first. Without this
# guard the farm rule ate every stick the villagers cut (85 firings in 800 s) and the camp's 100 wood was never banked -
# the death spiral in one line.
when = { has_building = ["mill", "lumber_camp"], stock = [{ name = "food", at_most = 120 }, { name = "wood", at_least = 120 }] }
do = "build"
role = "farm"
where = "food"

[[rule]]
player = 1
cooldown_seconds = 10.0
when = { age = "feudal_age", has_building = ["market", "blacksmith"], villagers_at_least = 28, no_tech = "castle_age" }
do = "research"
building = "town_center"
tech = "castle_age"

# --- Castle: the siege line, and the match -----------------------------------------------------------------------

[[rule]]
player = 1
cooldown_seconds = 6.0
when = { age = "castle_age", no_building = "siege_workshop" }
do = "build"
role = "siege_workshop"

[[rule]]
player = 1
cooldown_seconds = 8.0
when = { age = "castle_age", has_building = ["siege_workshop"] }
do = "train"
building = "siege_workshop"
role = "mangonel"

[[rule]]
player = 1
cooldown_seconds = 12.0
when = { has_unit = "mangonel" }
do = "attack"
attacker = "mangonel"
target = "enemy_town_center"

# --- Where the villagers go ---------------------------------------------------------------------------------------
#
# Villager shares, in the shape the game's own AI uses (`docs/ai-of-the-game.md`): a percentage per resource, per
# villager count, which the engine applies to idle villagers. The numbers are HD's own
# `Economy/Low-pop Villager Distribution.per`, whose 19 rules cover 1 to 26+ villagers and every row sums to 100; the
# row with the highest `at_villagers` the player has reached is the one that applies, and a resource a row does not
# name is 0%. Empty (or absent) means "no policy": the engine then never moves a villager on its own.
#
# It lives here because it is behaviour (D94): "how many on wood" is exactly what a personality decides, so a match
# whose AI writes no `[policy]` plays with no shares at all, and `economy.toml` refuses a leftover block by name.
[policy]

[[policy.share]]
at_villagers = 0
food = 100

[[policy.share]]
at_villagers = 9
food = 88
wood = 12

[[policy.share]]
at_villagers = 10
food = 80
wood = 20

