# The area of every decision, authored rather than derived (D166).
#
# A derived topic was tried and refused: counting the words and paths a decision names filed the
# file-oracle decision under "Pathfinding & movement" because "step 2b" contains "step", and put 45
# decisions in one area whose first four were licensing, fixed-point and scope. Areas are a claim about
# what a decision is *about*, so they are written down and checked, not guessed.
#
# `make decisions` refuses to build when: a decision has no area here, this file names a decision the
# corpus does not define, or an area is missing from [order]. Edit this file to correct a filing.

[order]
areas = [
  "Combat",
  "Pathfinding & movement",
  "Economy",
  "Buildings & construction",
  "Production & queues",
  "Techs & civs",
  "Vision & fog",
  "Victory & defeat",
  "UI",
  "Graphics",
  "AI",
  "Simulation core",
  "Data & tooling",
  "Licensing & publication",
  "Project process",
]

# An undecided question is shown inside the area group it belongs to, so it is filed the same way.
# Only open questions need a line here; a closed one has stopped being a question.
[unknown]
U5 = "Pathfinding & movement"
U7 = "Pathfinding & movement"
U10 = "Techs & civs"
U12 = "Simulation core"
U13 = "Techs & civs"
U14 = "Economy"
U17 = "Combat"
U18 = "Simulation core"
U20 = "Economy"
U21 = "Data & tooling"
U22 = "Economy"
U23 = "Data & tooling"

